<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iraq Shop</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="box">

<img src="https://i.imgur.com/8Km9tLL.jpeg">

<h2 id="product">اسم المنتج</h2>

<div class="price">
<span id="price">25000</span> دينار
</div>

<div class="qty">
<button type="button" onclick="minus()">-</button>

<span id="quantity">1</span>

<button type="button" onclick="plus()">+</button>
</div>

<div class="cart">
🛒 السلة: <span id="cart">1</span>
</div>

<form id="orderForm">

<input
type="tel"
id="phone"
placeholder="رقم الهاتف العراقي"
pattern="07[0-9]{9}"
maxlength="11"
required
>

<select id="province" required>
<option value="">اختر المحافظة</option>
<option>بغداد</option>
<option>البصرة</option>
<option>نينوى</option>
<option>أربيل</option>
<option>النجف</option>
<option>كربلاء</option>
<option>الأنبار</option>
<option>بابل</option>
<option>دهوك</option>
<option>ديالى</option>
<option>ذي قار</option>
<option>السليمانية</option>
<option>صلاح الدين</option>
<option>القادسية</option>
<option>كركوك</option>
<option>ميسان</option>
<option>المثنى</option>
<option>واسط</option>
</select>

<textarea
id="address"
placeholder="العنوان الكامل"
required
></textarea>

<button class="whatsapp" type="submit">
طلب عبر الواتساب
</button>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
